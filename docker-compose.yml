# Demo local: `docker compose up --build`
# Le variaveis de um arquivo .env (copie de .env.example). Veja docs/DEPLOY.md.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_password_123}
      POSTGRES_DB: soberania_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soberania_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        # Embutidas no bundle em tempo de build.
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
        NEXT_PUBLIC_INSTITUTION_TIMEZONE: ${NEXT_PUBLIC_INSTITUTION_TIMEZONE:-America/Sao_Paulo}
        # Demo/evals: sem isso o modo review da tutora so abre dentro do horario do plantao.
        NEXT_PUBLIC_AGENDA_IGNORE_TIME_WINDOW: ${NEXT_PUBLIC_AGENDA_IGNORE_TIME_WINDOW:-true}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Sobrescrevem o .env: dentro do compose o banco e o host "db".
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local_password_123}@db:5432/soberania_db?schema=public
      NODE_ENV: production
      SEED_DEMO: ${SEED_DEMO:-true}
      # Producao exige 32+ caracteres. Valor abaixo e SO para a demo local.
      AUTH_SECRET: ${AUTH_SECRET:-demo-local-secret-troque-em-qualquer-ambiente-real-0123456789}
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/storage

  # Opcional: LLM local. Descomente e use no .env:
  #   AI_PROVIDER=ollama
  #   AI_BASE_URL=http://ollama:11434/v1
  #   AI_MODEL=llama3.2:3b
  #   AI_EMBEDDING_MODEL=bge-m3   (dimensao 1024; rode: docker compose exec ollama ollama pull bge-m3)
  # ollama:
  #   image: ollama/ollama
  #   volumes:
  #     - ollama:/root/.ollama
  #   ports:
  #     - "11434:11434"

volumes:
  pgdata:
  storage:
  # ollama:
